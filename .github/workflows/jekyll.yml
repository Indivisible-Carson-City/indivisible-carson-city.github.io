name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 8 * * *"   # Daily rebuild at 8 AM UTC (1 AM PST) — expires stale alerts/spotlight
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Pre-fetch Substack feed
        run: |
          curl -sf --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -H "Accept: application/rss+xml, application/xml, text/xml" \
            -o _data/substack_feed.xml \
            "https://indivisiblecarsoncity.substack.com/feed" \
          && echo "Substack feed fetched successfully" \
          || echo "Substack feed fetch failed — will use cache"

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" --future
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

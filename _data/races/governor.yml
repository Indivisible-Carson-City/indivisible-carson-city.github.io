# Nevada Governor candidate comparison
# Source: latest_Nevada_Governor_2026_Candidate_Comparison.docx (Aug 2026 revision).
# That revision already lists the Democrat first, drops the "Personal financial disclosure"
# and "Tariffs" rows, and reorders the issues — this file follows it exactly.
# Sources text comes from the document's Word footer.

title: "Nevada Governor"
race: "Governor of Nevada"
blurb: "How the two candidates for Governor of Nevada compare on background and on the issues."
endorsed:

candidates:
  - key: ford
    name: "Aaron Ford"
    party: D
    party_label: Democrat
  - key: lombardo
    name: "Joe Lombardo"
    party: R
    party_label: Republican

background_heading: "Qualifications, Background & General Info"
background:
  - label: Residency
    cells:
      - text: "Has lived in Nevada for 26 years."
      - text: "Has lived in Nevada for 50 years."

  - label: Career
    cells:
      - text: >-
          Current Nevada Attorney General, first elected in 2018 and reelected in 2022; his term ends
          January 2027. Served in the Nevada State Senate from 2013–2019, including as Senate Majority
          Leader 2017–2019.
      - text: >-
          Incumbent Governor of Nevada, first elected in 2022; running for a second term. Served 8
          years as Sheriff of Clark County (2015–2023), 26 years with the Las Vegas Metropolitan Police
          Department. Served in the Nevada Army National Guard & U.S. Army Reserve, 1980–1986.

  - label: Education
    cells:
      - text: >-
          Earned five academic degrees, including a bachelor's degree from Texas A&M University, a
          master's degree from George Washington University, and three degrees from The Ohio State
          University encompassing a law degree and a Ph.D.
      - text: "Holds a BS and MS from the University of Nevada, Las Vegas."

  - label: Endorsed By
    cells:
      - text: >-
          Nevada State AFL-CIO, AFSCME, SEIU Local 1107, UAW, several building trades unions
          (Bricklayers Local 13, Ironworkers Local 433, IUOE, IUPAT), Nevada State Education
          Association, Washoe Education Association, Planned Parenthood Action Fund, Reproductive
          Freedom for All, Moms Demand Action, End Citizens United, and Nevada Conservation League.
      - text: >-
          Vegas Chamber, Nevada Realtors, Associated Builders and Contractors Nevada, Nevada Trucking
          Association, Armed Forces Chamber, Turning Point Action, NVGOP, Nevada Right to Life,
          Professional Firefighters of Nevada, Clark County Education Association, and several
          police/sheriff associations.

positions_heading: "Campaign Positions"
positions:
  - issue: "Housing — Should Nevada limit corporations buying homes?"
    cells:
      - stance: Supports
        text: >-
          Said he will "limit corporate investors buying single family homes and crack down on
          predatory landlords." Wants to crack down on Wall Street/institutional investors buying up
          single-family homes, push back on tariffs that raise construction costs, and ease permitting
          to encourage new construction on vacant land.
      - stance: Abstaining
        text: >-
          Did not give a direct yes or no answer. Lombardo vetoed a bill to cap corporate ownership in
          2023, then reportedly blocked a 2025 effort that would have imposed even stricter limits.

  - issue: "Jobs, the Economy & Cost of Living"
    cells:
      - text: >-
          Campaign says Nevada has one of the highest unemployment rates in the country and that Las
          Vegas tourism has fallen amid Trump-era tariffs. Frames his platform around lowering costs
          for working families and expanding economic opportunity.
      - text: >-
          Cites a 4.3% increase in employment since 2022, more than $5 billion in new economic
          investment, and a 15% cut to the Modified Business Tax rate. Cut or streamlined more than 900
          state regulations.

  - issue: "Corporate Tax Breaks and Abatements"
    cells:
      - stance: Concerned
        text: >-
          Has expressed that the state needs to reevaluate corporate tax abatements and ensure large
          incoming industries, such as major data centers, pay a fair share for utility and resource
          impacts.
      - stance: Supports
        text: >-
          Views them as vital tools to diversify the state's economy, attract businesses, and lower the
          Modified Business Tax.

  - issue: "Iran War"
    cells:
      - stance: Opposes
        text: >-
          Strongly criticizes the conflict and blames it for driving up inflation and spiking gas and
          grocery prices for families.
      - stance: Supports
        text: >-
          Wrote a letter supporting Trump's new budget bill to add another $70 billion towards the Iran
          War.

  - issue: "SAVE Act / Elections and Voting"
    cells:
      - stance: Opposes
        text: >-
          He said there's not enough evidence that voter fraud exists in the state to justify imposing
          a new requirement to exercise the right to vote. He said there would have to be a compelling
          reason to add identification requirements to the state's voting process.
      - stance: Supports
        text: >-
          Says he "wholeheartedly" supports voter ID, but vetoed a 2025 voter ID bill (AB499), saying
          it applied ID rules unevenly between in-person and mail voters. Also vetoed a bill (AB105)
          banning firearms at or near polling places, saying existing law already addresses voter
          intimidation.

  - issue: "Data Centers"
    cells:
      - stance: Opposes
        text: >-
          He has created a comprehensive accountability plan which includes: no new tax breaks until
          all data centers are audited by his office, new legislation requiring data centers use and
          pay for clean energy, job requirements regarding pay and benefits, a ban on water-wasting
          cooling, and public hearings before any new centers are built.
      - stance: Abstaining
        paragraphs:
          - >-
            Did not give a direct yes or no answer but said that the state already has strong measures
            in place to shield ratepayers from bearing the costs associated with data centers.
          - >-
            Data centers are one of Lombardo's largest campaign contributors and under his term the
            state has given data center companies over $200 million of Nevadans' tax abatements.

  - issue: "Energy & Climate Change"
    cells:
      - stance: Supports
        text: >-
          Prioritizes clean, affordable energy. Has fought NV Energy's mandatory demand charge as
          Attorney General and says he would require data centers to pay their fair share for added
          energy demand and to commit to water conservation, while promoting residential solar and
          efficiency incentives.
      - stance: Opposes
        text: >-
          Says he has "stood up for Nevadans against California's extreme energy policies," per his
          campaign material.

  - issue: "Healthcare"
    cells:
      - text: >-
          As Attorney General, won more than $1.2 billion in opioid settlements. As governor, would
          target Pharmacy Benefit Manager practices that he says withhold drug-price savings from
          consumers, pursue a medical debt relief program, and expand access to the state's public
          option, Battle Born State Plans.
      - text: >-
          Created the Nevada Health Authority consolidating existing programs to streamline services.
          Expanded community behavioral health centers and the statewide 988 crisis system.

  - issue: "ICE Tactics"
    cells:
      - stance: Opposes
        text: >-
          As Attorney General, issued nonbinding "model immigration policies" guidance encouraging
          state agencies, schools, and hospitals not to use local resources for civil immigration
          enforcement.
      - stance: Supports
        text: >-
          Says Nevada will "continue to follow federal law" and has disputed his administration's own
          model immigration guidance.

  - issue: "Public Safety & Criminal Justice"
    cells:
      - text: >-
          As Attorney General, has prioritized prosecuting human trafficking cases. He said during a
          bill (AB236) hearing that implemented criminal justice reforms that it "better aligns our
          resource by focusing on incarcerating violent offenders who pose a risk to public safety
          while helping nonviolent offenders who need treatment."
      - text: >-
          Delivered double-digit pay raises for state law enforcement. Increased penalties for drug and
          fentanyl trafficking.

  - issue: "Reproductive Rights"
    cells:
      - stance: Supports
        text: >-
          He is going to "ensure that Nevada itself remains a firewall, not just in name, but in
          practice … that means protecting abortion access, safeguarding IVF, keeping politicians out
          of private medical decisions."
      - stance: Abstaining
        text: >-
          Describes himself as personally "pro-life," said he would respect Nevada's existing law
          permitting abortion up to 24 weeks. In 2022 said he would support a ballot measure letting
          voters decide on a 13-week abortion ban and other restrictions such as parental notification.

  - issue: "Gun Safety"
    cells:
      - stance: Supports
        text: >-
          As Attorney General, defended the state's ghost-gun regulation in court (Sisolak v.
          Polymer80) and promoted Extreme Risk Protection Order ("red flag law") training for law
          enforcement. Oversaw enforcement of universal background checks and, as Senate Majority
          Leader, helped pass 2019 gun-safety legislation.
      - stance: Opposes
        text: >-
          Says he will veto any legislation restricting the right to keep and bear arms. Worked to end
          Clark County's firearm registry in 2015. Vetoed multiple gun-safety bills passed by the
          Legislature, including bans on guns at polling places and raising the purchase age for
          semiautomatic firearms to 21.

  - issue: "Education Funding"
    cells:
      - stance: Supports
        text: >-
          Wants to increase public education funding to raise the state's per-pupil spending to the
          national average — a roughly $2 billion expenditure — but is not open to adding new taxes.
      - stance: Abstaining
        text: >-
          He has not indicated whether he supported further increasing public education funding for the
          next two years and is focusing heavily on expanding charter schools and school choice.

sources: >-
  Candidates' official campaign websites (joelombardofornv.com, fordfornevada.com), the Nevada
  Governor's Office, and nonpartisan news coverage (The Nevada Independent, Associated Press,
  Ballotpedia). Compiled August 2026; candidate positions may be updated or clarified as the campaign
  continues. Blank or limited entries reflect that no public position was identified in available
  sources as of this date.

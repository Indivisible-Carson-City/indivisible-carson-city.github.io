background_heading: "Qualifications, Background & General Info"
background:
  - label: Residency
    cells:
      - text: "Has lived in Nevada for 26 years."
      - text: "Has lived in Nevada for 50 years."

  - label: Career
    cells:
      - paragraphs:
          - >-
            Current Nevada Attorney General, first elected in 2018 and reelected in 2022; his term ends
            January 2027.
          - >-
            Served in the Nevada State Senate from 2013–2019, including as Senate Majority Leader
            (2017–2019).
      - paragraphs:
          - "Incumbent Governor of Nevada, first elected in 2022; running for a second term."
          - >-
            Served 8 years as Sheriff of Clark County (2015–2023), capping a 34-year law enforcement

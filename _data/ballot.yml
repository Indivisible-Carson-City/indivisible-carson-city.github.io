questions_heading: "Ballot Questions"
questions:
  - number: 6
    title: "Right to Abortion Initiative"
    vote: "yes"
    paragraphs:
      - >-
        Question 6 seeks to make NRS 442.250, Nevada's voter-approved abortion protections, a
        constitutional amendment, preventing future legislatures from weakening or repealing them. It
        also affirms that abortion access applies to anyone receiving care in Nevada, including
        non-residents.
      - >-
        The measure modernizes the statute by allowing qualified medical professionals, acting within
        their scope of practice, to provide abortion care.
      - >-
        Additional provisions in NRS regulations address Informed Consent, Additional Informed Consent
        standards, Parental notification for minors and Reporting, Recordkeeping and medical standards.
        These would remain fully intact and are not changed by Question 6.
  - number: 7
    title: "Require Voter Identification Initiative"
    vote: "no"
    paragraphs:
      - >-
        An amendment to the Nevada Constitution that would require photo identification to be required
        when voting in person, or for the addition of either the last 4 digits of their Nevada Driver's
        License number or their Social Security card or their Voter Registration number.
      - >-
        Nevada currently uses a system of matching a voter's signature completed at the polls when
        providing their name, address and signing attesting that they are aware it is illegal and
        subject to steep fines for voting more than once to an electronic copy of their signature
        obtained through DMV &/or Voter Registration files. Other electronic copies may be utilized
        if needed. Forensic handwriting research has shown that signatures contain highly identifiable
        features and that human examiners (the election workers) are highly accurate at distinguishing
        genuine signatures from forgeries. Studies have been done by the National Institute of Standards
        & Technology (NIST), MIT's Election Administration Research group and the Brennan Center for
        Justice - Signature Verification Analysis. In each case, Nevada's system of signature
        verification as well as its system for "curing" (making right) ballots are validated.
      - >-
        Currently there is no evidence to show that the Signature Verification in NV is faulty. There
        are no instructions or guidance in this Constitutional Amendment for Election Officials to use
        on how to utilize photo identification. Additionally, studies from NIST have shown that facial
        appearance changes enough over 2-5 years to reduce accuracy, especially for those over the age
        of 40. Psychology studies done by the Univ of Aberdeen have shown that "people correctly matched
        unfamiliar faces to ID photos only 70-80% of the time". Together, TSA and DMV data show that
        driver's-license photos are not a stable long-term identifier, and mismatches are common.
